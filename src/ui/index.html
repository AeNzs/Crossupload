<!doctype html>
<html lang="id" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CrossUpload — Multi-Platform Video Studio</title>
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div style="display:flex; align-items:center; gap:20px;">
        <a href="/" id="brand-link" class="brand">
          <span class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
              <polyline points="2 17 12 22 22 17"></polyline>
              <polyline points="2 12 12 17 22 12"></polyline>
            </svg>
          </span>
          <div>
            <div class="brand-title">CrossUpload <span class="rust-pill">Rust</span></div>
            <div class="brand-sub">Multi-Platform Studio</div>
          </div>
        </a>

        <nav class="nav-pills">
          <button type="button" id="nav-upload" class="nav-btn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            Upload
          </button>
          <button type="button" id="nav-queue" class="nav-btn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
            Antrean
            <span id="nav-queue-badge" class="nav-count hidden">0</span>
          </button>
        </nav>
      </div>

      <div class="actions">
        <button type="button" id="btn-open-creds" class="btn btn-outline" title="Kelola Kredensial API & Akun Platform">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 18v3c0 .6.4 1 1 1h4v-3h3v-3h2l1.4-1.4a6.5 6.5 0 1 0-4-4Z"></path>
            <circle cx="16.5" cy="7.5" r=".5" fill="#fbbf24"></circle>
          </svg>
          <span>Kredensial</span>
          <span id="cred-status-dot" class="dot dot-mut"></span>
        </button>

        <button type="button" id="btn-theme" class="btn btn-ghost btn-icon" title="Ganti tema gelap/terang">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
        </button>

        <button type="button" id="btn-logout" class="btn btn-ghost btn-icon" title="Keluar">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="container">
    <div id="toast-box" style="margin-top:16px;" class="hidden"></div>
    <main id="app-root"></main>
  </div>

  <!-- Slide-over Drawer Kredensial (Ikon Kunci) -->
  <div id="cred-drawer" class="drawer-backdrop hidden">
    <aside class="drawer-panel" role="dialog" aria-modal="true">
      <div class="drawer-head">
        <div>
          <div style="display:flex; align-items:center; gap:8px; font-weight:700; font-size:15px;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2.2">
              <path d="M2 18v3c0 .6.4 1 1 1h4v-3h3v-3h2l1.4-1.4a6.5 6.5 0 1 0-4-4Z"></path>
              <circle cx="16.5" cy="7.5" r=".5" fill="#fbbf24"></circle>
            </svg>
            Kredensial &amp; Koneksi Akun
          </div>
          <div class="mut" style="font-size:12px; margin-top:3px;">
            Kelola Client ID, Secret, dan akun YouTube, TikTok, Facebook, serta Instagram di satu tempat.
          </div>
        </div>
        <button type="button" id="btn-close-creds" class="btn btn-ghost btn-icon" aria-label="Tutup">✕</button>
      </div>
      <div id="cred-drawer-body" class="drawer-body"></div>
    </aside>
  </div>

  <script src="/assets/app.js"></script>
</body>
</html>
