<!doctype html>
<html lang="id" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Masuk: CrossUpload</title>
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body style="padding-bottom:0;">
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <span class="brand-cue" aria-hidden="true"></span>
        <span class="brand-title">CrossUpload</span>
      </div>
      <div class="actions">
        <button type="button" id="btn-login-theme" class="btn btn-ghost btn-icon" aria-label="Ganti tema gelap atau terang">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="login-shell">
    <div class="login-card">
      <div style="margin-bottom:20px;">
        <h1 class="page-title" style="font-size:1.35rem;">Masuk ke CrossUpload</h1>
        <p class="page-sub">Masukkan email dan password dari konfigurasi lokal Anda.</p>
      </div>

      <form id="login-form" class="stack" style="gap:14px;">
        <div>
          <label class="field-label" for="login-email">Email</label>
          <input id="login-email" class="input" name="email" type="email" placeholder="email@contoh.id" autocomplete="username" required autofocus />
        </div>
        <div>
          <label class="field-label" for="login-password">Password</label>
          <input id="login-password" class="input" name="password" type="password" placeholder="Masukkan password" autocomplete="current-password" required />
        </div>
        <div id="login-err" role="alert" class="alert alert-bad hidden"></div>
        <button id="login-btn" class="btn btn-lg" type="submit" style="width:100%;">Masuk ke Studio</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container" style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px;">
      <span>CrossUpload · Studio publikasi video ke YouTube, TikTok, Instagram, dan Facebook</span>
      <div style="display:flex; flex-wrap:wrap; gap:16px;">
        <a href="/terms" style="padding:10px 0;">Terms of Service</a>
        <a href="/privacy" style="padding:10px 0;">Privacy Policy</a>
        <a href="/data-deletion" style="padding:10px 0;">Data Deletion</a>
      </div>
    </div>
  </footer>

  <script>
    (function () {
      const saved = localStorage.getItem("cp_theme");
      document.documentElement.classList.toggle("dark", saved ? saved === "dark" : true);
      document.getElementById("btn-login-theme").addEventListener("click", () => {
        const nextDark = !document.documentElement.classList.contains("dark");
        document.documentElement.classList.toggle("dark", nextDark);
        localStorage.setItem("cp_theme", nextDark ? "dark" : "light");
      });

      const form = document.getElementById("login-form");
      const errBox = document.getElementById("login-err");
      const btn = document.getElementById("login-btn");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        btn.disabled = true;
        errBox.classList.add("hidden");
        const fd = new FormData(form);
        try {
          const r = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: fd.get("email"), password: fd.get("password") }),
          });
          if (r.ok) {
            location.href = "/";
            return;
          }
          const j = await r.json().catch(() => ({}));
          errBox.textContent = j.error || "Email atau password salah";
          errBox.classList.remove("hidden");
        } catch {
          errBox.textContent = "Tidak dapat menghubungi server lokal";
          errBox.classList.remove("hidden");
        }
        btn.disabled = false;
      });
    })();
  </script>
</body>
</html>
